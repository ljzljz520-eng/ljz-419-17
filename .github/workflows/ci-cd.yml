# ================================================================
# 企业级微服务应用 - CI/CD 流水线
# 
# 触发条件:
#   - push 到 main / develop 分支
#   - Pull Request 到 main 分支
# ================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  REGISTRY: ghcr.io
  USER_SERVICE_IMAGE: ghcr.io/${{ github.repository_owner }}/label-419-user-service
  PROFILE_SERVICE_IMAGE: ghcr.io/${{ github.repository_owner }}/label-419-profile-service
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/label-419-frontend

jobs:
  # ==================== 代码质量检查 ====================
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        working-directory: services/user-service
        run: |
          pip install -r requirements.txt
          pip install flake8 black isort mypy

      - name: 代码格式检查 (Black)
        working-directory: services/user-service
        run: black --check --diff app/ tests/

      - name: Import 排序检查 (isort)
        working-directory: services/user-service
        run: isort --check-only --diff app/ tests/

      - name: 代码规范检查 (Flake8)
        working-directory: services/user-service
        run: flake8 app/ --max-line-length=120 --ignore=E501,W503

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 前端代码检查
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present

  # ==================== 后端单元测试 ====================
  test-backend:
    name: 后端测试
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: user_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        working-directory: services/user-service
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: 运行单元测试
        working-directory: services/user-service
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/user_db_test
          JWT_SECRET_KEY: test-secret-key
          JWT_ALGORITHM: HS256
          SERVICE_NAME: user-service
          LOG_LEVEL: WARNING
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            services/user-service/test-results.xml
            services/user-service/coverage.xml

  # ==================== 资料服务单元测试（无数据库依赖） ====================
  test-profile-service:
    name: 资料服务测试
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 安装依赖
        working-directory: services/profile-service
        run: pip install -r requirements.txt

      - name: 运行单元测试
        working-directory: services/profile-service
        env:
          JWT_SECRET_KEY: ci-jwt-secret-key-please-change
          JWT_ALGORITHM: HS256
          LOG_LEVEL: WARNING
        run: python -m pytest tests/ -v --tb=short

  # ==================== 前端构建测试 ====================
  test-frontend:
    name: 前端构建测试
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前端
        working-directory: frontend
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ==================== Docker 镜像构建 ====================
  build:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [ test-backend, test-profile-service, test-frontend ]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建用户服务镜像
        uses: docker/build-push-action@v5
        with:
          context: ./services/user-service
          push: false
          tags: oa-user-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建资料服务镜像
        uses: docker/build-push-action@v5
        with:
          context: ./services/profile-service
          push: false
          tags: oa-profile-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建前端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: oa-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 集成测试 ====================
  integration-test:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启动所有服务
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: user_db
          POSTGRES_REPLICATION_USER: replicator
          POSTGRES_REPLICATION_PASSWORD: repl123456
          PGPOOL_ADMIN_USERNAME: pgpooladmin
          PGPOOL_ADMIN_PASSWORD: pgpooladmin123
          JWT_SECRET_KEY: ci-jwt-secret-key-please-change
        run: |
          docker compose up -d --build --wait
          sleep 15

      - name: 检查服务状态
        run: docker compose ps

      - name: 健康检查 - 用户服务
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8010/health; then
              echo "用户服务健康检查通过"
              exit 0
            fi
            echo "等待用户服务启动... ($i/10)"
            sleep 5
          done
          echo "健康检查超时"
          docker compose logs user-service
          exit 1

      - name: 健康检查 - 资料服务
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8012/health; then
              echo "资料服务健康检查通过"
              exit 0
            fi
            echo "等待资料服务启动... ($i/10)"
            sleep 5
          done
          echo "资料服务健康检查超时"
          docker compose logs profile-service
          exit 1

      - name: API 接口测试 - 服务间调用与降级
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8010/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"123456"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['access_token'])")

          # 正常路径：profile-service 内部调用 user-service 合并数据
          curl -sf http://localhost:8012/api/v1/profiles/me \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin)['data']; assert d['degraded'] is False and d['user']['username']=='admin', d; print('服务间调用合并成功')"

          # user-service 故障时：profile-service 降级返回资料数据而非 5xx
          curl -sf -X PUT "http://localhost:8012/api/v1/profiles/demo/faults/upstream?failed=true" > /dev/null
          curl -sf http://localhost:8012/api/v1/profiles/me \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin)['data']; assert d['degraded'] is True and d['profile'] is not None and d['warnings'], d; print('user-service 故障时降级成功')"
          curl -sf -X DELETE http://localhost:8012/api/v1/profiles/demo/faults > /dev/null

          # 经 Kong 网关访问资料服务（无令牌应返回 401，证明路由已生效）
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/profiles/me)
          test "$code" = "401" && echo "Kong 资料服务路由通过（401）" || (echo "Kong 路由异常: $code"; exit 1)

      - name: 健康检查 - 前端
        run: |
          curl -sf http://localhost:3000 > /dev/null && echo "前端服务健康检查通过"

      - name: 健康检查 - Kong 网关
        run: |
          curl -sf http://localhost:8001/status > /dev/null && echo "Kong 网关健康检查通过"
          curl -sf http://localhost:8003/status > /dev/null && echo "Kong 副本网关健康检查通过"

      - name: API 接口测试 - 注册
        run: |
          response=$(curl -sf -X POST http://localhost:8010/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"citest","email":"ci@test.com","password":"test123456","confirm_password":"test123456"}')
          echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['success'], f'注册失败: {d}'"
          echo "注册接口测试通过"

      - name: API 接口测试 - 登录
        run: |
          response=$(curl -sf -X POST http://localhost:8010/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"123456"}')
          echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['success'] and d['data']['access_token'], f'登录失败: {d}'"
          echo "登录接口测试通过"

      - name: API 接口测试 - 通过 Kong 网关
        run: |
          response=$(curl -sf http://localhost:8000/api/v1/health)
          echo "$response"
          echo "Kong 网关路由测试通过"

      - name: HA 验证 - 关闭主网关后访问副本
        run: |
          docker compose stop kong-1
          sleep 5
          curl -sf http://localhost:8002/api/v1/health > /dev/null
          echo "主网关故障时可通过副本继续访问"

      - name: HA 验证 - Pgpool 双实例可用
        run: |
          docker compose exec -T postgres-pool-1 pg_isready -h 127.0.0.1 -p 5432 -U postgres
          docker compose exec -T postgres-pool-2 pg_isready -h 127.0.0.1 -p 5432 -U postgres
          echo "Pgpool 双实例健康"

      - name: 输出服务日志
        if: failure()
        run: docker compose logs

      - name: 清理环境
        if: always()
        run: docker compose down -v

  # ==================== 镜像发布（仅 main 分支） ====================
  publish-images:
    name: 发布镜像
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送用户服务镜像
        uses: docker/build-push-action@v5
        with:
          context: ./services/user-service
          push: true
          tags: |
            ${{ env.USER_SERVICE_IMAGE }}:${{ github.sha }}
            ${{ env.USER_SERVICE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送资料服务镜像
        uses: docker/build-push-action@v5
        with:
          context: ./services/profile-service
          push: true
          tags: |
            ${{ env.PROFILE_SERVICE_IMAGE }}:${{ github.sha }}
            ${{ env.PROFILE_SERVICE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 部署（仅 main 分支）====================
  deploy:
    name: 部署
    runs-on: ubuntu-latest
    needs: publish-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 校验部署参数
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_REGISTRY_USERNAME: ${{ secrets.DEPLOY_REGISTRY_USERNAME }}
          DEPLOY_REGISTRY_TOKEN: ${{ secrets.DEPLOY_REGISTRY_TOKEN }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_REGISTRY_USERNAME"
          test -n "$DEPLOY_REGISTRY_TOKEN"

      - name: 部署到生产环境（Docker Compose）
        uses: appleboy/ssh-action@v1.0.3
        env:
          USER_SERVICE_IMAGE: ${{ env.USER_SERVICE_IMAGE }}:${{ github.sha }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          DEPLOY_REGISTRY: ${{ env.REGISTRY }}
          DEPLOY_REGISTRY_USERNAME: ${{ secrets.DEPLOY_REGISTRY_USERNAME }}
          DEPLOY_REGISTRY_TOKEN: ${{ secrets.DEPLOY_REGISTRY_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: USER_SERVICE_IMAGE,FRONTEND_IMAGE,DEPLOY_REGISTRY,DEPLOY_REGISTRY_USERNAME,DEPLOY_REGISTRY_TOKEN,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "$DEPLOY_REGISTRY_TOKEN" | docker login "$DEPLOY_REGISTRY" -u "$DEPLOY_REGISTRY_USERNAME" --password-stdin

            export USER_SERVICE_IMAGE
            export FRONTEND_IMAGE
            docker compose pull user-service user-service-replica frontend
            docker compose up -d --no-deps user-service user-service-replica frontend kong-1 kong-2

            docker compose exec -T user-service python -c "from app.database import ensure_schema_exists, Base, engine; ensure_schema_exists(); Base.metadata.create_all(bind=engine)"
            docker compose ps
            echo "✅ 部署完成: ${USER_SERVICE_IMAGE}, ${FRONTEND_IMAGE}"
